services:
  postgres:
    image: postgres:16-alpine
    container_name: sweety-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sweety_db
    ports:
      - "5432:5432"
    volumes:
      - sweety-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sweety_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sweety-api
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/sweety_db
      JWT_SECRET: sweety_production_super_secret_jwt_key_2026
      CLIENT_URL: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sweety-web
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  sweety-pgdata:
